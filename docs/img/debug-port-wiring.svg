<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="680" fill="#f7f7f4"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#222">CC3200 Toniebox debug port — pads, ribbon socket, and where each wire goes</text>
  <text x="30" y="70" font-size="16" fill="#555">Port location: back of the main board (side without the SD slot), bottom-left, next to the big charging connector, near test points TP7 / TP301 / TP54 / TP13.</text>

  <!-- ===== left panel: pads on the box ===== -->
  <text x="40" y="120" font-size="18" font-weight="700" fill="#222">Pads on the box</text>
  <text x="40" y="142" font-size="14" fill="#555">board back side up, charging connector to the RIGHT of the port</text>
  <rect x="40" y="160" width="520" height="270" rx="14" fill="#1f5f3a"/>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <!-- top row: 10 9 8 7 6 -->
    <circle cx="110" cy="240" r="28" fill="#d5d5d5"/><text x="110" y="246" fill="#333">10</text>
    <circle cx="200" cy="240" r="28" fill="#e74c3c"/><text x="200" y="246" fill="#fff">9</text>
    <circle cx="290" cy="240" r="28" fill="#d5d5d5"/><text x="290" y="246" fill="#333">8</text>
    <circle cx="380" cy="240" r="28" fill="#d5d5d5"/><text x="380" y="246" fill="#333">7</text>
    <circle cx="470" cy="240" r="28" fill="#d5d5d5"/><text x="470" y="246" fill="#333">6</text>
    <!-- bottom row: 1 2 3 4 5 -->
    <circle cx="110" cy="340" r="28" fill="#f1c40f"/><text x="110" y="346" fill="#333">1</text>
    <circle cx="200" cy="340" r="28" fill="#8e44ad"/><text x="200" y="346" fill="#fff">2</text>
    <circle cx="290" cy="340" r="28" fill="#9a9a9a" stroke="#fff" stroke-width="3" stroke-dasharray="6 4"/><text x="290" y="346" fill="#fff">3</text>
    <circle cx="380" cy="340" r="28" fill="#2e86de"/><text x="380" y="346" fill="#fff">4</text>
    <circle cx="470" cy="340" r="28" fill="#39b54a"/><text x="470" y="346" fill="#fff">5</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#fff" font-weight="600">
    <text x="200" y="198">SOP2</text>
    <text x="110" y="394">TX</text><text x="200" y="394">RX</text><text x="290" y="394">VCC</text><text x="380" y="394">RST</text><text x="470" y="394">GND</text>
  </g>
  <text x="290" y="416" font-size="12" text-anchor="middle" fill="#ffd2d2">leave unconnected</text>
  <text x="548" y="420" font-size="14" fill="#ffffff" text-anchor="end">charging connector ▶</text>

  <!-- ===== right panel: ribbon socket ===== -->
  <text x="620" y="120" font-size="18" font-weight="700" fill="#222">TC2050-IDC ribbon socket</text>
  <text x="620" y="142" font-size="14" fill="#555">looking into the holes, polarising bump on top — numbered ZIGZAG</text>
  <rect x="830" y="164" width="120" height="16" rx="3" fill="#333"/>
  <rect x="620" y="180" width="520" height="220" rx="10" fill="#2a2a2a"/>
  <rect x="620" y="180" width="10" height="220" fill="#e74c3c"/>
  <text x="640" y="424" font-size="13" fill="#c0392b">◀ red stripe / wire 1 side</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <!-- top row: 1 3 5 7 9 -->
    <rect x="672" y="222" width="56" height="56" rx="8" fill="#f1c40f"/><text x="700" y="257" fill="#333">1</text>
    <rect x="772" y="222" width="56" height="56" rx="8" fill="#9a9a9a" stroke="#fff" stroke-width="3" stroke-dasharray="6 4"/><text x="800" y="257" fill="#fff">3</text>
    <rect x="872" y="222" width="56" height="56" rx="8" fill="#39b54a"/><text x="900" y="257" fill="#fff">5</text>
    <rect x="972" y="222" width="56" height="56" rx="8" fill="#555"/><text x="1000" y="257" fill="#ccc">7</text>
    <rect x="1072" y="222" width="56" height="56" rx="8" fill="#e74c3c"/><text x="1100" y="257" fill="#fff">9</text>
    <!-- bottom row: 2 4 6 8 10 -->
    <rect x="672" y="302" width="56" height="56" rx="8" fill="#8e44ad"/><text x="700" y="337" fill="#fff">2</text>
    <rect x="772" y="302" width="56" height="56" rx="8" fill="#2e86de"/><text x="800" y="337" fill="#fff">4</text>
    <rect x="872" y="302" width="56" height="56" rx="8" fill="#555"/><text x="900" y="337" fill="#ccc">6</text>
    <rect x="972" y="302" width="56" height="56" rx="8" fill="#555"/><text x="1000" y="337" fill="#ccc">8</text>
    <rect x="1072" y="302" width="56" height="56" rx="8" fill="#555"/><text x="1100" y="337" fill="#ccc">10</text>
  </g>

  <!-- ===== bottom: mapping table ===== -->
  <rect x="30" y="450" width="1120" height="210" rx="12" fill="#fff" stroke="#ccc"/>
  <g font-size="15" fill="#222">
    <text x="60" y="480" font-weight="700">Signal</text><text x="230" y="480" font-weight="700">Box pad</text><text x="360" y="480" font-weight="700">Socket hole</text><text x="520" y="480" font-weight="700">Raspberry Pi header</text><text x="850" y="480" font-weight="700">Wire</text>
    <rect x="40" y="492" width="14" height="14" fill="#f1c40f"/><text x="60" y="504">TX (box out)</text><text x="230" y="504">1</text><text x="360" y="504">1</text><text x="520" y="504">pin 10 · RXD</text><text x="850" y="504">yellow</text>
    <rect x="40" y="515" width="14" height="14" fill="#8e44ad"/><text x="60" y="527">RX (box in)</text><text x="230" y="527">2</text><text x="360" y="527">2</text><text x="520" y="527">pin 8 · TXD</text><text x="850" y="527">purple</text>
    <rect x="40" y="538" width="14" height="14" fill="#2e86de"/><text x="60" y="550">RST</text><text x="230" y="550">4</text><text x="360" y="550">4</text><text x="520" y="550">pin 11 · GPIO17</text><text x="850" y="550">blue</text>
    <rect x="40" y="561" width="14" height="14" fill="#39b54a"/><text x="60" y="573">GND</text><text x="230" y="573">5</text><text x="360" y="573">5</text><text x="520" y="573">pin 6 · GND</text><text x="850" y="573">green</text>
    <rect x="40" y="584" width="14" height="14" fill="#e74c3c"/><text x="60" y="596">SOP2</text><text x="230" y="596">9</text><text x="360" y="596">9</text><text x="520" y="596">pin 1 · 3V3 (held high)</text><text x="850" y="596">red</text>
    <text x="60" y="640" font-size="13" fill="#777">VCC (pad 3 / hole 3) is not connected — the box runs on its own battery. 3.3 V logic only.</text>
  </g>
</svg>
